[project]
name = "zeta-music"
version = "0.1.0"
description = "The music of the primes: compositions generated from the nontrivial zeros of the Riemann zeta function"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joe Carr" }
]
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "mpmath>=1.4.1",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.11.2",
]
produce = [
    "pedalboard>=0.9.26",
    "pyloudnorm>=0.2.0",
]

[project.scripts]
zeta-music = "zeta_music.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pyloudnorm>=0.2.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeta_music"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: full renders (deselect with -m 'not slow')"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
